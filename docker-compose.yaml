services:
  catalogue:
    build: ./catalogue
    image: rchandana/mongodb:1.0.0   #this is equivalent to docker build -t rchandana/mongodb:1.0.0
    container_name: mongodb
    depends_on: 
    - mongodb
  user:
    build: ./user
    image: rchandana/user:1.0.0   #this is equivalent to docker build -t rchandana/mongodb:1.0.0
    container_name: user
    depends_on: 
    - redis
    - mongodb
  frontend:
    build: ./frontend
    image: rchandana/frontend:1.0.0   #this is equivalent to docker build -t rchandana/mongodb:1.0.0
    container_name: frontend
    ports:
    - "80:80"
    depends_on: 
    - catalogue
    - user
    - cart
    - shipping
    - payment
  redis:
    image: redis:7.0
    container_name: redis
    volumes:
    - redis:/data
  cart:
    build: ./cart
    image: rchandana/cart:1.0.0   #this is equivalent to docker build -t rchandana/mongodb:1.0.0
    container_name: cart
    depends_on: 
    - redis
    - catalogue
  shipping:
    build: ./shipping
    image: rchandana/shipping:1.0.0   #this is equivalent to docker build -t rchandana/mongodb:1.0.0
    container_name: shipping
    depends_on: 
    - mysql
    - cart
  payment:
    build: ./payment
    image: rchandana/payment:1.0.0   #this is equivalent to docker build -t rchandana/mongodb:1.0.0
    container_name: payment
    environment: 
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      "AMQP_HOST": "rabbitmq"
      "AMQP_USER": "roboshop"
      "AMQP_PASS": "roboshop123"
    depends_on: 
    - redis
    - cart
    - user
  rabbitmq:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    container_name: rabbitmq
    volumes:
    - rabbitmq:/var/lib/rabbitmq
  mysql:
    build: ./mysql
    image: rchandana/mysql:1.0.0   #this is equivalent to docker build -t rchandana/mongodb:1.0.0
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql
  mongodb:
    build: ./mongodb #it moves to mongodb directly
    image: rchandana/mongodb:1.0.0   #this is equivalent to docker build -t rchandana/mongodb:1.0.0
    container_name: mongodb
    volumes:
    - mongodb:/data/db
networks:
  default:
    driver: bridge
    name: roboshop
    external: false #if true, we need to create network manually
volumes:
  mongodb:   #docker creates volumes
  redis:
  mysql:
  rabbitmq:

